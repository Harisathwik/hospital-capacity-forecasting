[project]
name = "hospital-bed-forecasting"
version = "0.1.0"
description = "Hospital Bed Demand Forecasting — Predict ICU bed demand for proactive staffing"
requires-python = ">=3.10"
dependencies = [
    "zenml>=0.60.0",
    "mlflow>=2.14.0",
    "evidently>=0.4.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.38.0",
    "requests>=2.32.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
