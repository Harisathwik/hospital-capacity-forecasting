# Hospital Bed Demand Forecasting — Configuration

project:
  name: hospital-bed-forecasting
  version: 0.1.0
  random_seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  external_dir: data/external
  test_size_days: 30
  validation_size_days: 14

features:
  target: icu_bed_count
  date_column: date
  categorical:
    - day_of_week
    - is_holiday
    - is_flu_season
    - month
  numeric:
    - temperature
    - humidity
    - ili_rate
    - admissions_7d_avg
    - discharges_7d_avg
    - icu_bed_count_lag_1
    - icu_bed_count_lag_7
    - icu_bed_count_lag_14
    - icu_bed_count_rolling_7d
    - icu_bed_count_rolling_14d
  lag_features:
    - 1
    - 7
    - 14
  rolling_windows:
    - 7
    - 14
    - 30

model:
  type: xgboost
  params:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    early_stopping_rounds: 50

evaluation:
  primary_metric: rmse
  guardrail_metrics:
    - mae
    - mape
  prediction_interval: 0.95
  slice_by:
    - day_of_week
    - is_flu_season
    - month

serving:
  host: 0.0.0.0
  port: 8000
  model_stage: Production

monitoring:
  drift_threshold: 0.05
  psi_threshold: 0.2
  alert_email: ""
  check_frequency: daily

retraining:
  trigger: drift
  schedule: weekly
  min_samples: 30
