# AgenticRAG Configuration

llm:
  provider: openrouter
  model: anthropic/claude-sonnet-4
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.1
  max_tokens: 4096

retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  chunk_size: 512
  chunk_overlap: 64
  top_k: 10
  rerank_top_k: 5

vector_store:
  type: chromadb
  persist_directory: ./data/chroma_db
  collection_name: agentic_rag

agents:
  router:
    model: anthropic/claude-sonnet-4
    temperature: 0.0
  retrieval:
    model: anthropic/claude-sonnet-4
    temperature: 0.1
  citation:
    model: anthropic/claude-sonnet-4
    temperature: 0.0
  reasoning:
    model: anthropic/claude-sonnet-4
    temperature: 0.2
  validation:
    model: anthropic/claude-sonnet-4
    temperature: 0.0
  aggregator:
    model: anthropic/claude-sonnet-4
    temperature: 0.1
  guardrail:
    model: anthropic/claude-sonnet-4
    temperature: 0.0

guardrails:
  min_faithfulness_score: 0.85
  max_unsupported_claim_rate: 0.05
  enable_pii_detection: true
  enable_compliance_check: true

serving:
  host: 0.0.0.0
  port: 8000
  workers: 1

evaluation:
  metrics:
    - faithfulness
    - answer_relevancy
    - context_precision
    - context_recall
    - latency_p95
