# Hospital Bed Demand Forecasting — Configuration

project:
  name: icuflow
  version: 0.1.0
  random_seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  external_dir: data/external
  dataset_id: g62h-syeh
  source_url: "https://healthdata.gov/Hospital/COVID-19-Reported-Patient-Impact-and-Hospital-Cap/g62h-syeh"
  api_csv_base: "https://healthdata.gov/resource/g62h-syeh.csv"
  test_size_days: 30
  validation_size_days: 14

forecast:
  horizon_days: 7
  strategy: direct_multi_output

features:
  target: staffed_adult_icu_bed_occupancy
  date_column: date
  group_key: state
  categorical:
    - state
  numeric:
    - inpatient_beds
    - inpatient_beds_used
    - inpatient_beds_used_covid
    - inpatient_beds_utilization
    - total_staffed_adult_icu_beds
    - adult_icu_bed_utilization
    - previous_day_admission_adult_covid_confirmed
    - previous_day_admission_adult_covid_suspected
    - previous_day_admission_influenza_confirmed
    - total_patients_hospitalized_confirmed_influenza
    - critical_staffing_shortage_today_yes
    - critical_staffing_shortage_today_no
    - critical_staffing_shortage_anticipated_within_week_yes
    - critical_staffing_shortage_anticipated_within_week_no
    - staffed_adult_icu_bed_occupancy
  lag_features:
    - 1
    - 7
    - 14
  rolling_windows:
    - 7
    - 14
    - 30

model:
  baselines:
    - ridge
    - xgboost
  ridge:
    params:
      alpha: 1.0
  xgboost:
    params:
      n_estimators: 500
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
      early_stopping_rounds: 50

evaluation:
  primary_metric: asymmetric_rmse_under3x
  underprediction_penalty: 3.0
  guardrail_metrics:
    - mae
    - underprediction_rate
  prediction_interval: 0.95
  slice_by:
    - state

serving:
  host: 0.0.0.0
  port: 8000
  model_stage: Production

deployment:
  mode: batch
  schedule_local_time: "06:00"
  output_path: data/outputs/icu_occupancy_forecast.parquet

monitoring:
  mode: report_only
  report_dir: data/reports
  drift_threshold: 0.05
  psi_threshold: 0.2
  alert_email: ""
  check_frequency: daily
  prediction_monitoring:
    psi_threshold: 0.2
    dead_prediction_fraction: 0.5
    max_stale_minutes: 60

retraining:
  trigger: drift
  schedule: weekly
  min_samples: 30

governance:
  registry_stages:
    staging: Staging
    production: Production
  promotion_gates:
    require_beats_naive_baseline: true
    require_data_validation_pass: true
    require_reproducible_run: true
    require_underprediction_rate_below_threshold: true
  thresholds:
    max_underprediction_rate: 0.3

zenml_stack:
  name: local_mlops_stack
  orchestrator: default
  artifact_store: my_artifact_store
  experiment_tracker: mlflow_experiment_tracker
  model_registry: mlflow_model_registry
  data_validator: evidently_data_validator
